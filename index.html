<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beautiful Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌸 Image Gallery</h1>
        <p>Explore beautiful images</p>
    </header>

    <!-- Category Buttons -->
    <div class="filters">
        <button class="filter-btn active" onclick="filterImages('all')">
            All
        </button>

        <button class="filter-btn" onclick="filterImages('nature')">
            Nature
        </button>

        <button class="filter-btn" onclick="filterImages('city')">
            City
        </button>

        <button class="filter-btn" onclick="filterImages('animals')">
            Animals
        </button>
    </div>

    <!-- Image Gallery -->
    <main class="gallery">

        <div class="gallery-item nature">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80"
                 alt="Nature"
                 onclick="openLightbox(0)">
        </div>

        <div class="gallery-item nature">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
                 alt="Forest"
                 onclick="openLightbox(1)">
        </div>

        <div class="gallery-item city">
            <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=800&q=80"
                 alt="City"
                 onclick="openLightbox(2)">
        </div>

        <div class="gallery-item city">
            <img src="https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=800&q=80"
                 alt="City Night"
                 onclick="openLightbox(3)">
        </div>

        <div class="gallery-item animals">
            <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=800&q=80"
                 alt="Dog"
                 onclick="openLightbox(4)">
        </div>

        <div class="gallery-item animals">
            <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=800&q=80"
                 alt="Cat"
                 onclick="openLightbox(5)">
        </div>

        <div class="gallery-item nature">
            <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=800&q=80"
                 alt="Mountain"
                 onclick="openLightbox(6)">
        </div>

        <div class="gallery-item city">
            <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=800&q=80"
                 alt="Street"
                 onclick="openLightbox(7)">
        </div>

    </main>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">

        <span class="close" onclick="closeLightbox()">&times;</span>

        <button class="prev" onclick="previousImage()">&#10094;</button>

        <img id="lightbox-image" src="" alt="Gallery Image">

        <button class="next" onclick="nextImage()">&#10095;</button>

    </div>

    <footer>
        <p>© 2026 Image Gallery | HTML CSS JavaScript</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
